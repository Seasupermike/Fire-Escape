<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/gh/Seasupermike/KeyPresses@main/Input.js"></script>
    <title>Fire Escape</title>
    <link rel="stylesheet" href="styles.css" />
</head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="480" height="270" tabindex="0" aria-label="2D pixel art platformer"></canvas>
      <div class="hud" aria-hidden="true">
        <div class="meter">
          <span>HEIGHT</span>
          <strong id="height">0ft</strong>
        </div>
        <div class="meter">
          <span>BEST</span>
          <strong id="best">0ft</strong>
        </div>
        <div class="meter health-meter">
          <span>HEALTH</span>
          <div class="stepper">
            <button id="health-down" class="step-button" type="button" aria-label="Lower starting health">-</button>
            <strong id="health">3/3</strong>
            <button id="health-up" class="step-button" type="button" aria-label="Raise starting health">+</button>
          </div>
        </div>
        <button id="mute" class="icon-button" type="button" aria-label="Toggle sound">♪</button>
      </div>
      <div class="touch-pad" aria-hidden="true">
        <button class="touch-button" data-key="ArrowLeft" type="button">‹</button>
        <button class="touch-button jump" data-key="Space" type="button">⌃</button>
        <button class="touch-button" data-key="ArrowRight" type="button">›</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
